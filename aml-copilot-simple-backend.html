<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AML Copilot - Compliance Operations Console</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #f8fafc;
            color: #0f172a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .icon {
            display: inline-block;
            width: 1em;
            height: 1em;
            vertical-align: -0.125em;
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        // Simple icon SVG components
        const icons = {
            shield: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>',
            check: '<svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"></path></svg>',
            circle: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle></svg>',
            loader: '<svg class="icon animate-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10" style="opacity: 0.25;"></circle><path d="M4 12a8 8 0 0 1 16 0" style="stroke-linecap: round;"></path></svg>',
            alert: '<svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"></path></svg>',
            refresh: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36M20.49 15a9 9 0 0 1-14.85 3.36"></path></svg>',
            building: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="2" width="18" height="20" rx="2"></rect><line x1="9" y1="2" x2="9" y2="22"></line><line x1="15" y1="2" x2="15" y2="22"></line><line x1="3" y1="7" x2="21" y2="7"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="17" x2="21" y2="17"></line></svg>',
            user: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>',
            clock: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>',
            landmark: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="21" x2="21" y2="21"></line><line x1="9" y1="6" x2="9" y2="21"></line><line x1="15" y1="6" x2="15" y2="21"></line><path d="M9 6h6M3 21h18M5 21V9a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v12"></path></svg>',
        };

        const CASES = [
            {
                id: "CASE-10294",
                accountId: "ACC-889120",
                entity: "Meridian Textiles Ltd.",
                entityType: "corporate",
                jurisdiction: "Singapore",
                amount: 48200,
                flaggedDate: "16 Jul 2026, 14:42",
                trigger: "Structuring pattern — 6 wires below reporting threshold in 72h",
                autoRun: true,
                sanctions: {
                    matchFound: false,
                    confidence: 4,
                    matchedEntity: null,
                    disambiguationNote: null,
                    listSource: "OFAC SDN (mock)",
                },
                media: { flagsFound: 0, articles: [] },
                memo: {
                    riskScore: 4,
                    recommendation: "clear",
                    entitySummary:
                        "Meridian Textiles Ltd. is a Singapore-registered corporate entity flagged for a structuring pattern: six outbound wires in 72 hours, each individually below the $50,000 reporting threshold.",
                    sanctionsSection:
                        "No match against OFAC SDN (mock) or affiliated watchlists. Confidence of non-match: 96%.",
                    mediaSection: "No adverse media identified across searched sources.",
                    riskAssessment:
                        "Structuring pattern alone, with no sanctions nexus and no adverse media, does not meet the threshold for escalation. Transaction pattern is consistent with routine trade-finance activity for a textiles exporter of this size.",
                    recommendationText:
                        "Clear. No further action required. Retained in case history for ongoing pattern monitoring.",
                },
                freeze: null,
            },
            {
                id: "CASE-10295",
                accountId: "ACC-552031",
                entity: "Rajesh Kumar",
                entityType: "individual",
                jurisdiction: "United Kingdom",
                amount: 132500,
                flaggedDate: "16 Jul 2026, 09:07",
                trigger: "Beneficiary name matches a watchlist entry — pending verification",
                autoRun: false,
                sanctions: {
                    matchFound: true,
                    confidence: 38,
                    matchedEntity: "Rajesh Kumar — SDN #11842",
                    disambiguationNote:
                        "Name match only. DOB (14 Mar 1978) and location (Mumbai, IN) on the SDN entry conflict with the subject's on-file DOB (02 Nov 1990) and address (London, UK). Treated as an unconfirmed namesake pending secondary ID verification.",
                    listSource: "OFAC SDN (mock)",
                },
                media: {
                    flagsFound: 1,
                    articles: [
                        {
                            title: "Local ward committee names new member ahead of spring session",
                            url: "https://regional-gazette.example.com/ward-committee-appointments",
                            relevanceConfidence: 19,
                            publishedDate: "2026-02-11",
                        },
                    ],
                },
                memo: {
                    riskScore: 34,
                    recommendation: "escalate",
                    entitySummary:
                        "Rajesh Kumar is a UK-resident individual account holder flagged for a cross-border wire whose beneficiary name partially matches an SDN list entry.",
                    sanctionsSection:
                        "Partial name match to SDN #11842 (confidence 38%). Conflicting DOB and location on record — see disambiguation note. Not treated as a confirmed match.",
                    mediaSection:
                        "One low-relevance article identified (confidence 19%), referring to an unrelated namesake in a local council role. No adverse findings tied to the subject.",
                    riskAssessment:
                        "Combined signal is weak: the sanctions hit is a common-name collision contradicted by identity details on file, and adverse media returned no credible hits. Risk score reflects residual uncertainty rather than confirmed exposure.",
                    recommendationText:
                        "Escalate for manual review only — analyst to confirm identity documents against the conflicting DOB/location before this case can be cleared. Not a high-risk escalation.",
                },
                freeze: null,
            },
            {
                id: "CASE-10296",
                accountId: "ACC-771904",
                entity: "Volkov Holdings B.V.",
                entityType: "corporate",
                jurisdiction: "Cyprus",
                amount: 2450000,
                flaggedDate: "16 Jul 2026, 06:53",
                trigger: "Outbound wire to correspondent bank tied to a sanctioned beneficial owner",
                autoRun: false,
                sanctions: {
                    matchFound: true,
                    confidence: 97,
                    matchedEntity: "Volkov Holdings B.V. — SDN #45231 (EO 14024, Russia sanctions evasion network)",
                    disambiguationNote: null,
                    listSource: "OFAC SDN (mock)",
                },
                media: {
                    flagsFound: 3,
                    articles: [
                        {
                            title: "EU regulators name Volkov Holdings in sanctions-evasion probe",
                            url: "https://wire-news.example.com/eu-volkov-holdings-probe",
                            relevanceConfidence: 91,
                            publishedDate: "2026-05-12",
                        },
                        {
                            title: "Cyprus registrar flags shell-company network tied to Volkov Holdings",
                            url: "https://finance-desk.example.com/cyprus-registrar-volkov",
                            relevanceConfidence: 84,
                            publishedDate: "2026-03-02",
                        },
                        {
                            title: "Beneficial owner of Volkov Holdings added to UK sanctions list",
                            url: "https://wire-news.example.com/uk-sanctions-volkov-owner",
                            relevanceConfidence: 88,
                            publishedDate: "2026-06-30",
                        },
                    ],
                },
                memo: {
                    riskScore: 93,
                    recommendation: "escalate",
                    entitySummary:
                        "Volkov Holdings B.V. is a Cyprus-registered corporate entity flagged for a large outbound wire to a correspondent bank linked to a sanctioned beneficial owner.",
                    sanctionsSection:
                        "Strong match to SDN #45231 (confidence 97%), listed under EO 14024 for Russia sanctions evasion. No conflicting identity details.",
                    mediaSection:
                        "Three corroborating articles (confidence 84–91%) covering an EU sanctions-evasion probe, a Cyprus shell-company network, and a UK listing of the beneficial owner.",
                    riskAssessment:
                        "High-confidence sanctions match corroborated by independent adverse media across three sources. Pattern and jurisdiction are consistent with sanctions evasion typology. Risk score crosses the escalation and auto-freeze thresholds.",
                    recommendationText:
                        "Escalate immediately. Risk score exceeds the auto-freeze threshold (85) — a freeze request has been issued to the receiving bank pending compliance sign-off.",
                },
                freeze: {
                    reason:
                        "OFAC SDN match (97% confidence) — Volkov Holdings B.V.; risk score 93/100; corroborated by 3 adverse media sources.",
                    bankRef: "FRZ-2026-88231",
                    frozenAmount: 2450000,
                },
            },
        ];

        const money = (n) =>
            n.toLocaleString("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 });

        let selectedId = CASES[0].id;
        let runState = {};
        let timers = [];

        CASES.forEach((c) => {
            if (c.autoRun) {
                runState[c.id] = {
                    screening: "done",
                    media: "done",
                    memo: "done",
                    freeze: c.freeze ? "done" : "skipped",
                    status: c.memo.recommendation,
                    loggedAt: c.flaggedDate,
                };
            } else {
                runState[c.id] = { screening: "idle", media: "idle", memo: "idle", freeze: "idle", status: "pending", loggedAt: null };
            }
        });

        function render() {
            const selectedCase = CASES.find((c) => c.id === selectedId);
            const state = runState[selectedId];
            const isBusy = state.screening === "running" || state.media === "running" || state.memo === "running" || state.freeze === "running";
            const hasRun = state.memo === "done";
            const showAlarm = hasRun && selectedCase.memo.riskScore > 75;

            const statusMap = {
                clear: { label: "clear", cls: "bg-emerald-50 text-emerald-700 border-emerald-200" },
                pending: { label: "pending", cls: "bg-slate-100 text-slate-500 border-slate-200" },
                investigating: { label: "investigating", cls: "bg-amber-50 text-amber-700 border-amber-200" },
                escalate: { label: "escalate", cls: "bg-red-50 text-red-700 border-red-200" },
            };
            const statusStyle = statusMap[state.status] || statusMap.pending;

            let html = `
                <div class="w-full min-h-screen bg-slate-50 text-slate-900 font-sans">
                    <!-- top bar -->
                    <div class="flex items-center justify-between px-6 py-3 border-b border-slate-200 bg-white">
                        <div class="flex items-center gap-3">
                            <div class="w-7 h-7 rounded bg-slate-900 flex items-center justify-center text-white">
                                ${icons.shield}
                            </div>
                            <div>
                                <div class="text-sm font-medium leading-tight">AML Copilot</div>
                                <div class="text-[11px] text-slate-500 leading-tight">Compliance Operations Console</div>
                            </div>
                        </div>
                        <div class="text-[11px] font-mono text-slate-500 flex gap-4">
                            <span>Environment: <span class="text-slate-700">sandbox</span></span>
                            <span>Analyst: <span class="text-slate-700">m.chen</span></span>
                        </div>
                    </div>

                    <div class="flex">
                        <!-- sidebar -->
                        <div class="w-72 shrink-0 border-r border-slate-200 bg-white min-h-[calc(100vh-49px)]">
                            <div class="px-4 py-3 flex items-center justify-between border-b border-slate-100">
                                <span class="text-[11px] font-medium text-slate-500 tracking-wide">OPEN ALERTS</span>
                                <span class="text-[11px] text-slate-400">${CASES.length} cases</span>
                            </div>
                            <div>
                                ${CASES.map((c) => {
                                    const s = runState[c.id];
                                    const active = c.id === selectedId;
                                    const cStatusStyle = statusMap[s.status] || statusMap.pending;
                                    return `
                                        <button
                                            onclick="selectCase('${c.id}')"
                                            class="w-full text-left px-4 py-3 border-b border-slate-100 transition-colors ${
                                                active ? "bg-slate-50" : "hover:bg-slate-50"
                                            }"
                                        >
                                            <div class="flex items-center justify-between mb-1">
                                                <span class="text-[11px] font-mono text-slate-400">${c.id}</span>
                                                <span class="text-[11px] font-mono px-2 py-0.5 rounded border ${cStatusStyle.cls}">${cStatusStyle.label}</span>
                                            </div>
                                            <div class="text-sm font-medium text-slate-900">${c.entity}</div>
                                            <div class="flex items-center justify-between mt-0.5">
                                                <span class="text-[12px] text-slate-500">${c.jurisdiction}</span>
                                                <span class="text-[12px] font-mono text-slate-600">${money(c.amount)}</span>
                                            </div>
                                        </button>
                                    `;
                                }).join("")}
                            </div>
                        </div>

                        <!-- main panel -->
                        <div class="flex-1 px-6 py-5 max-w-4xl">
                            ${showAlarm ? `
                                <div class="mb-4 flex items-center gap-2 bg-red-50 border border-red-200 text-red-700 rounded px-3 py-2 text-[13px]">
                                    ${icons.alert}
                                    <span class="font-medium">Alarm — high-risk match confirmed.</span>
                                    <span>Risk score ${selectedCase.memo.riskScore}/100 crosses the escalation threshold.</span>
                                </div>
                            ` : ""}

                            <div class="flex items-start justify-between mb-4">
                                <div>
                                    <div class="text-[11px] font-mono text-slate-400 mb-1">
                                        ${selectedCase.id} &middot; ${selectedCase.accountId}
                                    </div>
                                    <div class="flex items-center gap-2">
                                        ${selectedCase.entityType === "individual" ? icons.user : icons.building}
                                        <h1 class="text-xl font-medium">${selectedCase.entity}</h1>
                                    </div>
                                    <div class="text-[13px] text-slate-500 mt-0.5">
                                        ${selectedCase.entityType === "individual" ? "Individual" : "Corporate"} · ${selectedCase.jurisdiction}
                                    </div>
                                </div>
                                <div class="text-right">
                                    <div class="text-[11px] font-mono text-slate-400 mb-1">Amount</div>
                                    <div class="text-2xl font-medium text-slate-900">${money(selectedCase.amount)}</div>
                                </div>
                            </div>

                            <!-- trigger -->
                            <div class="bg-white border border-slate-200 rounded-lg mb-4">
                                <div class="px-5 py-3 border-b border-slate-100 text-[11px] font-medium text-slate-500 tracking-wide">
                                    ALERT TRIGGER
                                </div>
                                <div class="px-5 py-4 text-[13px] text-slate-700">${selectedCase.trigger}</div>
                                <div class="px-5 pb-4 flex items-center gap-2">
                                    <button
                                        onclick="runInvestigation('${selectedCase.id}')"
                                        ${isBusy ? "disabled" : ""}
                                        class="inline-flex items-center gap-2 px-4 py-2 bg-slate-900 text-white text-[13px] font-medium rounded hover:bg-slate-800 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
                                    >
                                        ${isBusy ? `${icons.loader} Running investigation…` : `${icons.refresh} Run investigation`}
                                    </button>
                                </div>
                            </div>

                            <!-- investigation steps -->
                            <div class="bg-white border border-slate-200 rounded-lg mb-4">
                                <div class="px-5 py-3 border-b border-slate-100 text-[11px] font-medium text-slate-500 tracking-wide">
                                    INVESTIGATION STEPS
                                </div>
                                <div class="px-5 py-4 space-y-3">
                                    ${["screening", "media", "memo", "freeze"].map((key) => {
                                        const s = state[key];
                                        const stepNames = { screening: "screen_sanctions", media: "search_adverse_media", memo: "draft_edd_memo", freeze: "send_freeze_request" };
                                        let icon = icons.circle;
                                        if (s === "done") icon = `<span style="color: #059669;">${icons.check}</span>`;
                                        if (s === "running") icon = `<span style="color: #b45309;">${icons.loader}</span>`;
                                        return `
                                            <div class="flex items-center gap-3">
                                                ${icon}
                                                <div class="flex-1 min-w-0">
                                                    <div class="text-[12px] font-mono text-slate-600">${stepNames[key]}</div>
                                                </div>
                                            </div>
                                        `;
                                    }).join("")}
                                </div>
                            </div>

                            ${hasRun ? `
                                <!-- sanctions section -->
                                <div class="bg-white border border-slate-200 rounded-lg mb-4">
                                    <div class="px-5 py-3 border-b border-slate-100 text-[11px] font-medium text-slate-500 tracking-wide">
                                        SANCTIONS SCREENING
                                    </div>
                                    <div class="px-5 py-4">
                                        ${selectedCase.sanctions.matchFound ? `
                                            <div class="flex items-start gap-2">
                                                <span style="color: #b45309;">⚠️</span>
                                                <div>
                                                    <div class="text-[13px] font-medium text-slate-900">${selectedCase.sanctions.matchedEntity}</div>
                                                    ${selectedCase.sanctions.disambiguationNote ? `<div class="text-[12px] text-slate-600 mt-1">${selectedCase.sanctions.disambiguationNote}</div>` : ""}
                                                    <div class="text-[11px] text-slate-500 mt-2">Confidence: ${selectedCase.sanctions.confidence}%</div>
                                                </div>
                                            </div>
                                        ` : `
                                            <div class="flex items-center gap-2 text-emerald-700">
                                                ${icons.check}
                                                <span class="text-[13px] font-medium">No match found</span>
                                            </div>
                                        `}
                                    </div>
                                </div>

                                <!-- adverse media section -->
                                <div class="bg-white border border-slate-200 rounded-lg mb-4">
                                    <div class="px-5 py-3 border-b border-slate-100 text-[11px] font-medium text-slate-500 tracking-wide">
                                        ADVERSE MEDIA
                                    </div>
                                    <div class="px-5 py-4">
                                        ${selectedCase.media.flagsFound > 0 ? `
                                            <div class="space-y-3">
                                                ${selectedCase.media.articles.map((article) => `
                                                    <div class="border-b border-slate-100 pb-3 last:border-0 last:pb-0">
                                                        <a href="${article.url}" target="_blank" rel="noopener noreferrer" class="text-[13px] font-medium text-blue-600 hover:underline">
                                                            ${article.title}
                                                        </a>
                                                        <div class="text-[11px] text-slate-500 mt-1">
                                                            Relevance: ${article.relevanceConfidence}% · ${article.publishedDate}
                                                        </div>
                                                    </div>
                                                `).join("")}
                                            </div>
                                        ` : `
                                            <div class="flex items-center gap-2 text-emerald-700">
                                                ${icons.check}
                                                <span class="text-[13px] font-medium">No adverse media found</span>
                                            </div>
                                        `}
                                    </div>
                                </div>

                                <!-- memo section -->
                                <div class="bg-white border border-slate-200 rounded-lg mb-4">
                                    <div class="px-5 py-3 border-b border-slate-100 text-[11px] font-medium text-slate-500 tracking-wide">
                                        EDD MEMO
                                    </div>
                                    <div class="px-5 py-4 space-y-3 text-[13px] text-slate-700 leading-relaxed">
                                        <div>
                                            <div class="text-[11px] font-medium text-slate-400 tracking-wide mb-1">ENTITY SUMMARY</div>
                                            ${selectedCase.memo.entitySummary}
                                        </div>
                                        <div>
                                            <div class="text-[11px] font-medium text-slate-400 tracking-wide mb-1">SANCTIONS SCREENING FINDINGS</div>
                                            ${selectedCase.memo.sanctionsSection}
                                        </div>
                                        <div>
                                            <div class="text-[11px] font-medium text-slate-400 tracking-wide mb-1">ADVERSE MEDIA FINDINGS</div>
                                            ${selectedCase.memo.mediaSection}
                                        </div>
                                        <div>
                                            <div class="text-[11px] font-medium text-slate-400 tracking-wide mb-1">OVERALL RISK ASSESSMENT</div>
                                            ${selectedCase.memo.riskAssessment}
                                        </div>
                                        <div>
                                            <div class="text-[11px] font-medium text-slate-400 tracking-wide mb-1">RECOMMENDATION</div>
                                            ${selectedCase.memo.recommendationText}
                                        </div>
                                    </div>
                                </div>

                                ${selectedCase.freeze && (state.freeze === "running" || state.freeze === "done") ? `
                                    <!-- freeze request -->
                                    <div class="bg-white border border-slate-200 rounded-lg mb-4">
                                        <div class="px-5 py-3 border-b border-slate-100 text-[11px] font-medium text-slate-500 tracking-wide">
                                            FREEZE REQUEST — RECEIVING BANK
                                        </div>
                                        <div class="px-5 py-4 text-[13px] text-slate-700">
                                            ${state.freeze === "running" ? `
                                                <div class="flex items-center gap-2 text-amber-700">
                                                    ${icons.loader}
                                                    Awaiting acknowledgement from receiving bank…
                                                </div>
                                            ` : `
                                                <div class="space-y-1.5">
                                                    <div class="flex items-center gap-2 text-emerald-700 font-medium">
                                                        ${icons.landmark}
                                                        Acknowledged — ${money(selectedCase.freeze.frozenAmount)} frozen
                                                    </div>
                                                    <div class="text-slate-500">Bank reference: <span class="font-mono text-slate-700">${selectedCase.freeze.bankRef}</span></div>
                                                    <div class="text-slate-500">Reason: ${selectedCase.freeze.reason}</div>
                                                </div>
                                            `}
                                        </div>
                                    </div>
                                ` : ""}

                                <div class="flex items-center gap-1.5 text-[11px] text-slate-400 pb-4">
                                    ${icons.clock}
                                    Logged to case history · ${state.loggedAt}
                                </div>
                            ` : ""}
                        </div>
                    </div>
                </div>
            `;

            document.getElementById("app").innerHTML = html;
        }

        function selectCase(caseId) {
            selectedId = caseId;
            render();
        }

        async function runInvestigation(caseId) {
            const c = CASES.find((x) => x.id === caseId);
            if (!c) return;
            timers.forEach(clearTimeout);
            timers=[];
            runState[caseId]={screening:"running",media:"running",memo:"running",freeze:"idle",status:"investigating",loggedAt:null};
            render();
            try{
                const response=await fetch("http://localhost:5000/investigate",{
                    method:"POST",
                    headers:{"Content-Type":"application/json"},
                    body:JSON.stringify({customerName:c.entity})
                });
                if(!response.ok) throw new Error("HTTP "+response.status);
                const result=await response.json();

                c.sanctions.matchFound=!!(result.sanctions?.match);
                c.sanctions.confidence=result.sanctions?.confidence??0;
                c.sanctions.matchedEntity=c.sanctions.matchFound?c.entity:null;
                c.media.flagsFound=result.media?.articles?.length??0;
                c.media.articles=(result.media?.articles??[]).map(a=>({
                    title:a.title??"Article",
                    url:a.url??"#",
                    relevanceConfidence:a.relevanceConfidence??75,
                    publishedDate:a.publishedDate??"Today"
                }));
                if(result.risk){
                    c.memo.riskScore=result.risk.score??0;
                    c.memo.recommendation=((result.risk.level||"").toLowerCase()=="high")?"escalate":(((result.risk.level||"").toLowerCase()=="medium")?"investigating":"clear");
                }
                if(result.edd){
                    c.memo.entitySummary=result.edd.summary??c.memo.entitySummary;
                    c.memo.sanctionsSection=result.edd.sanctionsFindings??c.memo.sanctionsSection;
                    c.memo.mediaSection=result.edd.adverseMediaFindings??c.memo.mediaSection;
                    c.memo.riskAssessment=result.edd.riskAssessment??c.memo.riskAssessment;
                    c.memo.recommendationText=result.edd.recommendation??c.memo.recommendationText;
                }
                runState[caseId]={screening:"done",media:"done",memo:"done",freeze:c.memo.riskScore>=85?"done":"skipped",status:c.memo.recommendation,loggedAt:new Date().toLocaleString()};
                render();
            }catch(err){
                console.error(err);
                alert("Could not connect to backend on http://localhost:5000/investigate");
                runState[caseId].status="pending";
                render();
            }
        }

        // Initial render
        render();
    </script>
</body>
</html>
